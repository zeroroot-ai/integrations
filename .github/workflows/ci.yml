# CI for the first-party Gibson integrations monorepo (ADR-0065).
#
# Path-filtered and per-module: a PR that touches plugins/<x>/ or
# connectors/<x>/ runs only that module's `go test`. Each changed plugin
# module is additionally built to a container image; connectors are validated
# by their schema smoke test (the module's `go test`). A fork inherits this
# file verbatim — no secrets are needed because the Gibson SDK is public.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Discover which plugin/connector modules changed, so downstream jobs run
  # only against them. On a push to main (no diff base) every module runs.
  #
  # A pull request that changes the root Makefile or this workflow changes what
  # runs for EVERY module, so it puts every module in scope. Without that rule
  # such a pull request selects no module, every downstream job skips, and the
  # change to the gate merges untested.
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      plugins: ${{ steps.set.outputs.plugins }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: set
        # Everything from the event reaches the script as an environment
        # variable. github.base_ref is a branch name a PR author chooses, and
        # it used to be interpolated straight into this run: block.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            pr=1
            if printf '%s\n' "$changed" | grep -qxE 'Makefile|\.github/workflows/ci\.yml'; then
              echo "root Makefile or ci.yml changed: every module is in scope"
              pr=0
            fi
          else
            changed=""
            pr=0
          fi
          mods=""
          for d in plugins/*/ connectors/*/; do
            d="${d%/}"
            [ -f "$d/go.mod" ] || continue
            if [ "$pr" = "0" ] || printf '%s\n' "$changed" | grep -q "^$d/"; then
              mods="${mods}${d}"$'\n'
            fi
          done
          list="$(printf '%s' "$mods" | sed '/^$/d')"
          modules_json="$(printf '%s\n' "$list" | sed '/^$/d' | jq -R . | jq -cs .)"
          # plugins is an INCLUDE MATRIX: one object per plugin with the image
          # name and the plugin.yaml version. The image job calls the shared
          # build, which is a reusable workflow, and a job that `uses:` one
          # cannot run a step first — so the lookup that used to live in that
          # job's `meta` step lives here.
          plugins_json="$(printf '%s\n' "$list" | sed '/^$/d' | { grep '^plugins/' || true; } | while IFS= read -r p; do
              [ -n "$p" ] || continue
              vendor="$(basename "$p")"
              image="$(printf 'ghcr.io/%s/%s' "$REPO" "$vendor" | tr '[:upper:]' '[:lower:]')"
              version="$(yq -r '.metadata.version // ""' "$p/plugin.yaml")"
              jq -cn --arg plugin "$p" --arg vendor "$vendor" --arg image "$image" --arg version "$version" \
                '{plugin:$plugin, vendor:$vendor, image:$image, version:$version}'
            done | jq -cs .)"
          # A plugin with no metadata.version cannot be tagged, and a pipeline
          # cannot fail the step from inside its subshell — so check the result.
          if printf '%s' "$plugins_json" | jq -e 'map(select(.version == "" or .version == "null")) | length > 0' >/dev/null; then
            printf '%s' "$plugins_json" | jq -r '.[] | select(.version == "" or .version == "null") | "::error::\(.plugin)/plugin.yaml has no metadata.version"'
            exit 1
          fi
          echo "modules=${modules_json}" >> "$GITHUB_OUTPUT"
          echo "plugins=${plugins_json}" >> "$GITHUB_OUTPUT"
          echo "changed modules: ${modules_json}"
          echo "changed plugins: ${plugins_json}"
  test:
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      # The Makefile exports GOTOOLCHAIN=auto, so each module fetches the Go
      # version its go.mod pins.
      - name: make build check test
        env:
          MODULE: ${{ matrix.module }}
        run: make build check test MODULES="$MODULE"

  # Build a container image for each changed plugin module (declarative
  # connectors have no image), and PUBLISH it to ghcr so a cluster can pull it
  # (ADR-0065 R5: plugin deploy = CI-built image + Helm + GitOps). On a pull
  # request the image is build-only — nothing is pushed, so a fork PR cannot
  # publish. On a push to main the image is pushed to
  # ghcr.io/<repo>/<vendor> under three tags: the plugin.yaml version (the tag
  # the deploy chart's values pin, e.g. :0.1.0), an immutable :sha-<commit>,
  # and the moving :latest. A fork inherits this verbatim and publishes to its
  # OWN ghcr namespace (github.repository is the fork), using the fork's
  # GITHUB_TOKEN — no cross-org secret is needed.
  plugin-image:
    needs: discover
    if: needs.discover.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.plugins) }}
    # THE SHARED BUILD (.github#81). This job used to call
    # docker/build-push-action itself, with a hand-rolled licence label and
    # three hand-written tags — and no SBOM, no cosign attestation, no SLSA
    # provenance, no Trivy scan before the push, and no verification that the
    # image actually shipped its licence text. A fix landed in the shared
    # workflow reached every other repo and not this one.
    #
    # Tag shape, before -> after: `:<version>` stays (version_tag);
    # `:sha-<12>` becomes the shared `:sha-<7>`; `:latest` stays, on push to
    # main. Nothing in the estate pins a plugin image by the 12-char form.
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@017f26148bffdc5d382a265edd863e8a647e7830 # v0.4.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: ${{ matrix.vendor }}
      # The REPOSITORY ROOT, not the plugin directory: the image has to carry
      # its licence text, LICENSE lives at the root, and Docker cannot read a
      # file outside the context. Each Dockerfile copies only its own subtree.
      component_path: .
      dockerfile_path: ${{ matrix.plugin }}/Dockerfile
      image_name: ${{ matrix.image }}
      tag_pattern: ${{ matrix.vendor }}/v(.*)
      version_tag: ${{ matrix.version }}
